<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutrition API — GPC Browser</title>
<style>
  :root {
    --surface-0: #f2f2f0;
    --surface-1: #fcfcfb;
    --surface-2: #e9e9e5;
    --border:    #dedddA;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #78776f;
    --gpc:  #b57e00;
    --gpc-soft: #f3e6c8;
    --brick: #2a78d6;
    --bad:  #e34948;
    --good: #008300;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-0: #111110;
      --surface-1: #1a1a19;
      --surface-2: #232320;
      --border:    #35342f;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #8f8e84;
      --gpc:  #d9a53a;
      --gpc-soft: #3a2f16;
      --brick: #3987e5;
      --bad:  #e66767;
      --good: #4caf50;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem 4rem;
    background: var(--surface-0); color: var(--text-primary);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; margin-bottom: .25rem; }
  h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.01em; }
  h1 .g { color: var(--gpc); }
  .sub { color: var(--text-secondary); font-size: .875rem; margin: 0 0 1.25rem; }
  a { color: var(--brick); }
  .nav { margin-left: auto; font-size: .8125rem; }

  form { display: flex; gap: .5rem; margin-bottom: 1rem; }
  input[type=text] {
    flex: 1; padding: .625rem .75rem; font-size: 1rem;
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px;
  }
  input[type=text]:focus { outline: 2px solid var(--gpc); outline-offset: 1px; }
  button {
    padding: .625rem 1.1rem; font-size: .9375rem; font-weight: 600; cursor: pointer;
    background: var(--gpc); color: #fff; border: 0; border-radius: 8px;
  }
  button:disabled { opacity: .55; cursor: progress; }

  .samples { display: flex; flex-wrap: wrap; gap: .375rem; margin-bottom: 1.5rem; }
  .chip {
    font-size: .8125rem; padding: .3rem .7rem; border-radius: 999px; cursor: pointer;
    background: var(--surface-1); color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .chip:hover { border-color: var(--gpc); color: var(--gpc); }

  .crumb { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem; margin-bottom: 1rem; font-size: .8125rem; }
  .crumb a, .crumb span { color: var(--text-secondary); }
  .crumb a { cursor: pointer; text-decoration: none; }
  .crumb a:hover { color: var(--gpc); }
  .crumb .sep { color: var(--text-muted); }
  .crumb .here { color: var(--text-primary); font-weight: 600; }

  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 1rem 1.15rem; margin-bottom: 1rem;
  }
  .card h2 {
    font-size: .75rem; text-transform: uppercase; letter-spacing: .07em;
    color: var(--text-muted); margin: 0 0 .7rem; font-weight: 700;
    display: flex; align-items: center; gap: .5rem;
  }
  .card h2 .n {
    font-variant-numeric: tabular-nums; background: var(--surface-2);
    color: var(--text-secondary); border-radius: 999px; padding: 0 .5rem;
    font-size: .6875rem; letter-spacing: 0;
  }

  .row {
    display: flex; align-items: center; gap: .6rem; width: 100%;
    padding: .5rem .1rem; border: 0; border-bottom: 1px solid var(--border);
    background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .row:last-child { border-bottom: 0; }
  .row:hover { color: var(--gpc); }
  .row .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .75rem;
    color: var(--text-muted); background: var(--surface-2);
    padding: .1rem .4rem; border-radius: 4px; flex: none; min-width: 5.5rem; text-align: center;
  }
  .row .label { flex: 1; }
  .row .chevron { color: var(--text-muted); flex: none; }
  .row.leaf { cursor: default; }
  .row.leaf:hover { color: inherit; }

  /* attribute display */
  .attr { padding: .6rem .1rem; border-bottom: 1px solid var(--border); }
  .attr:last-child { border-bottom: 0; }
  .attr .at { font-weight: 600; font-size: .9375rem; margin-bottom: .35rem; }
  .attr .vals { display: flex; flex-wrap: wrap; gap: .3rem; }
  .aval {
    font-size: .8125rem; padding: .15rem .55rem; border-radius: 4px;
    background: var(--gpc-soft); color: var(--gpc);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  mark { background: var(--gpc-soft); color: var(--gpc); padding: 0 .1em; border-radius: 2px; }

  /* search: attribute hit shows its bricks */
  .ahit { padding: .55rem .1rem; border-bottom: 1px solid var(--border); }
  .ahit:last-child { border-bottom: 0; }
  .ahit .top { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
  .ahit .kind {
    font-size: .625rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700;
    color: var(--gpc); border: 1px solid var(--gpc); border-radius: 999px; padding: 0 .4rem;
  }
  .ahit .val { font-weight: 600; }
  .ahit .type { color: var(--text-muted); font-size: .8125rem; }
  .ahit .bricks { margin-top: .35rem; display: flex; flex-wrap: wrap; gap: .3rem; }
  .ahit .brick {
    font-size: .75rem; padding: .15rem .5rem; border-radius: 4px; cursor: pointer;
    background: var(--surface-2); color: var(--brick); border: 1px solid var(--border);
  }
  .ahit .brick:hover { border-color: var(--brick); }

  .muted { color: var(--text-muted); font-size: .875rem; }
  .loading { color: var(--text-muted); font-size: .875rem; padding: .5rem 0; }
  footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border);
    font-size: .75rem; color: var(--text-muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="g">GPC</span> Browser</h1>
    <span class="nav"><a href="/">← Lookup tester</a> · <a href="/gpc/mappings">Mapping viewer</a> · <a href="/docs">/docs</a></span>
  </header>
  <p class="sub">
    Browse the GS1 Global Product Classification: Segment → Family → Class → Brick → Attributes.
    Search reaches into attribute values too — try <em>olive oil</em>.
  </p>

  <form id="form">
    <input type="text" id="q" placeholder="Search the taxonomy…" autocomplete="off">
    <button type="submit" id="go">Search</button>
  </form>
  <div class="samples" id="samples"></div>

  <div id="crumb" class="crumb"></div>
  <div id="out"></div>

  <footer>Taxonomy from <a href="https://www.gs1.org/standards/gpc">GS1 GPC</a>, Food/Beverage segment.</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const api = p => fetch(p).then(r => r.json());

let lastQuery = "";
const hi = (text) => {
  if (!lastQuery) return esc(text);
  const i = String(text).toLowerCase().indexOf(lastQuery.toLowerCase());
  if (i < 0) return esc(text);
  const t = String(text);
  return esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + lastQuery.length)) + "</mark>" + esc(t.slice(i + lastQuery.length));
};

const SAMPLES = [
  ["olive oil", "🫒 olive oil"],
  ["caffeine", "☕ caffeine"],
  ["gluten", "🌾 gluten"],
  ["chocolate", "🍫 chocolate"],
  ["organic", "🌱 organic"],
];
$("samples").innerHTML = SAMPLES.map(([q, l]) =>
  `<button type="button" class="chip" data-q="${esc(q)}">${esc(l)}</button>`).join("");
$("samples").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  $("q").value = c.dataset.q; search();
});

function setCrumb(parts) {
  // parts: [{label, go} ...]; last is current (no link)
  $("crumb").innerHTML = parts.map((p, i) => {
    const last = i === parts.length - 1;
    const el = last
      ? `<span class="here">${esc(p.label)}</span>`
      : `<a data-i="${i}">${esc(p.label)}</a>`;
    return el + (last ? "" : `<span class="sep">›</span>`);
  }).join("");
  $("crumb").querySelectorAll("a[data-i]").forEach(a =>
    a.onclick = () => parts[+a.dataset.i].go());
}

function rowList(title, count, items, onClick) {
  if (!items.length) return "";
  const rows = items.map(it => `
    <button class="row" data-code="${esc(it.code)}">
      <span class="code">${esc(it.code)}</span>
      <span class="label">${hi(it.label)}</span>
      <span class="chevron">›</span>
    </button>`).join("");
  return `<div class="card" data-kind="${title}"><h2>${title}<span class="n">${count}</span></h2>${rows}</div>`;
}

async function showSegments() {
  setCrumb([{ label: "All segments", go: showSegments }]);
  $("out").innerHTML = `<div class="loading">Loading…</div>`;
  const body = await api("/api/v1/gpc/segments/");
  const html = rowList("Segments", body.count,
    body.results.map(s => ({ code: s.segment_code, label: s.description })));
  $("out").innerHTML = html;
  wire($("out"), code => showSegment(code));
}

async function showSegment(code) {
  const d = await api(`/api/v1/gpc/segments/${code}`);
  setCrumb([
    { label: "All segments", go: showSegments },
    { label: d.description, go: () => showSegment(code) },
  ]);
  $("out").innerHTML = rowList("Families", d.families.length,
    d.families.map(f => ({ code: f.family_code, label: f.description })));
  wire($("out"), c => showFamily(c));
}

async function showFamily(code) {
  const d = await api(`/api/v1/gpc/families/${code}`);
  const seg = d.segment_code_details;
  setCrumb([
    { label: "All segments", go: showSegments },
    ...(seg ? [{ label: seg.segment_description, go: () => showSegment(seg.segment_code) }] : []),
    { label: d.description, go: () => showFamily(code) },
  ]);
  $("out").innerHTML = rowList("Classes", d.classes.length,
    d.classes.map(c => ({ code: c.class_code, label: c.description })));
  wire($("out"), c => showClass(c));
}

async function showClass(code) {
  const d = await api(`/api/v1/gpc/classes/${code}`);
  const f = d.family_code_details;
  setCrumb([
    { label: "All segments", go: showSegments },
    ...(f ? [
      { label: f.segment_description, go: () => showSegment(f.segment_code) },
      { label: f.description, go: () => showFamily(f.family_code) },
    ] : []),
    { label: d.description, go: () => showClass(code) },
  ]);
  $("out").innerHTML = rowList("Bricks", d.bricks.length,
    d.bricks.map(b => ({ code: b.brick_code, label: b.description })));
  wire($("out"), c => showBrick(c));
}

async function showBrick(code) {
  const d = await api(`/api/v1/gpc/bricks/${code}`);
  const c = d.class_code_details;
  const trail = [{ label: "All segments", go: showSegments }];
  if (c) trail.push(
    { label: c.segment_description, go: () => showSegment(c.segment_code) },
    { label: c.family_description, go: () => showFamily(c.family_code) },
    { label: c.description, go: () => showClass(c.class_code) },
  );
  trail.push({ label: d.description, go: () => showBrick(code) });
  setCrumb(trail);

  const attrs = d.attributes || [];
  const inner = attrs.length
    ? attrs.map(a => `
        <div class="attr">
          <div class="at">${esc(a.att_type_text)}</div>
          <div class="vals">${(a.values || []).map(v =>
            `<span class="aval">${esc(v.att_value_text)}</span>`).join("")}</div>
        </div>`).join("")
    : `<p class="muted">This brick defines no attributes.</p>`;
  $("out").innerHTML =
    `<div class="card"><h2>Brick <span class="n">${esc(d.brick_code)}</span></h2>
       <p style="margin:0 0 .3rem;font-weight:600">${esc(d.description)}</p></div>
     <div class="card"><h2>Attributes<span class="n">${attrs.length}</span></h2>${inner}</div>`;
}

function wire(container, onCode) {
  container.querySelectorAll(".row[data-code]").forEach(r =>
    r.onclick = () => onCode(r.dataset.code));
}

async function search() {
  const q = $("q").value.trim();
  if (!q) { showSegments(); return; }
  lastQuery = q;
  $("go").disabled = true;
  setCrumb([{ label: "All segments", go: showSegments }, { label: `Search: “${q}”`, go: () => search() }]);
  $("out").innerHTML = `<div class="loading">Searching…</div>`;
  try {
    const b = await api(`/api/v1/gpc/search/?q=${encodeURIComponent(q)}`);
    const counts = b.counts || {};
    let html = "";

    // Attributes first — this is where "olive oil" lives.
    if ((b.attributes || []).length) {
      const hits = b.attributes.map(a => {
        const label = a.kind === "value"
          ? `<span class="val">${hi(a.att_value_text)}</span> <span class="type">in ${esc(a.att_type_text)}</span>`
          : `<span class="val">${hi(a.att_type_text)}</span>`;
        const bricks = (a.bricks || []).map(br =>
          `<span class="brick" data-code="${esc(br.brick_code)}">${esc(br.description)}</span>`).join("");
        return `<div class="ahit"><div class="top"><span class="kind">${a.kind}</span>${label}</div>
                  <div class="bricks">${bricks}</div></div>`;
      }).join("");
      html += `<div class="card"><h2>Attributes<span class="n">${counts.attributes ?? b.attributes.length}</span></h2>${hits}</div>`;
    }

    html += rowList("Bricks", counts.bricks ?? 0,
      (b.bricks || []).map(x => ({ code: x.brick_code, label: x.description })));
    html += rowList("Classes", counts.classes ?? 0,
      (b.classes || []).map(x => ({ code: x.class_code, label: x.description })));
    html += rowList("Families", counts.families ?? 0,
      (b.families || []).map(x => ({ code: x.family_code, label: x.description })));
    html += rowList("Segments", counts.segments ?? 0,
      (b.segments || []).map(x => ({ code: x.segment_code, label: x.description })));

    const total = Object.values(counts).reduce((a, c) => a + c, 0);
    if (!total) html = `<div class="card"><p class="muted">No matches for “${esc(q)}”.</p></div>`;
    else if (b.truncated) html += `<p class="muted">Some result lists were capped. Narrow the search to see the rest.</p>`;

    $("out").innerHTML = html;
    // brick chips inside attribute hits drill into the brick
    $("out").querySelectorAll(".ahit .brick[data-code]").forEach(el =>
      el.onclick = () => showBrick(el.dataset.code));
    // entity rows drill by kind
    $("out").querySelectorAll(".card[data-kind]").forEach(card => {
      const kind = card.dataset.kind;
      const go = { Bricks: showBrick, Classes: showClass, Families: showFamily, Segments: showSegment }[kind];
      card.querySelectorAll(".row[data-code]").forEach(r => r.onclick = () => go(r.dataset.code));
    });
  } finally {
    $("go").disabled = false;
  }
}

$("form").addEventListener("submit", e => { e.preventDefault(); search(); });
showSegments();
</script>
</body>
</html>
