<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutrition API — Status</title>
<meta name="theme-color" content="#171716">
<link rel="icon" href="/app/icons/icon-192.png">
<link rel="apple-touch-icon" href="/app/icons/icon-192.png">
<style>
  :root {
    --surface-0: #f2f2f0;
    --surface-1: #fcfcfb;
    --surface-2: #e9e9e5;
    --border:    #dedddA;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #78776f;
    --ok:   #1a8a3e;
    --ok-bg:   #e3f2e6;
    --warn: #b57e00;
    --warn-bg: #f6ecd2;
    --bad:  #c8322f;
    --bad-bg:  #f7dedd;
    --unknown: #8a8a84;
    --unknown-bg: #e9e9e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-0: #111110;
      --surface-1: #1a1a19;
      --surface-2: #232320;
      --border:    #35342f;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #8f8e84;
      --ok:   #58c877;
      --ok-bg:   #16301d;
      --warn: #e0b048;
      --warn-bg: #33280f;
      --bad:  #ef6b68;
      --bad-bg:  #351816;
      --unknown: #8f8e84;
      --unknown-bg: #262521;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2.5rem 1rem 4rem;
    background: var(--surface-0); color: var(--text-primary);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -.015em; }
  .nav { margin-left: auto; font-size: .8125rem; }
  .nav a { color: var(--text-secondary); }

  /* overall banner */
  .banner {
    display: flex; align-items: center; gap: .8rem; margin: 1.25rem 0 1.5rem;
    padding: 1rem 1.2rem; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface-1); border-left: 4px solid var(--bar, var(--unknown));
  }
  .banner .big { font-size: 1.15rem; font-weight: 700; }
  .banner .meta { margin-left: auto; text-align: right; font-size: .8125rem; color: var(--text-muted); }
  .banner .meta button {
    font: inherit; font-size: .75rem; cursor: pointer; margin-top: .2rem;
    background: var(--surface-2); color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 6px; padding: .2rem .55rem;
  }

  .section { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-muted); font-weight: 700; margin: 1.5rem 0 .6rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: .7rem; }

  .tile {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 11px; padding: .85rem 1rem; border-left: 3px solid var(--bar, var(--unknown));
  }
  .tile .head { display: flex; align-items: center; gap: .5rem; }
  .tile .name { font-weight: 650; }
  .pill {
    margin-left: auto; font-size: .6875rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; padding: .12rem .5rem; border-radius: 999px;
    color: var(--pc, var(--unknown)); background: var(--pb, var(--unknown-bg));
  }
  .tile .detail { margin-top: .45rem; font-size: .8125rem; color: var(--text-secondary); }
  .tile .detail .k { color: var(--text-muted); }
  .tile .detail div { margin-top: .12rem; }
  .tile .detail .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }

  .s-ok      { --bar: var(--ok);      --pc: var(--ok);      --pb: var(--ok-bg); }
  .s-warn    { --bar: var(--warn);    --pc: var(--warn);    --pb: var(--warn-bg); }
  .s-bad     { --bar: var(--bad);     --pc: var(--bad);     --pb: var(--bad-bg); }
  .s-unknown { --bar: var(--unknown); --pc: var(--unknown); --pb: var(--unknown-bg); }

  footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border);
    font-size: .8125rem; color: var(--text-muted); }
  footer a { color: var(--text-secondary); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Status</h1>
    <span class="nav"><a href="/">← Home</a> · <a href="/api/v1/health">raw JSON</a></span>
  </header>

  <div class="banner" id="banner">
    <span class="big" id="overall">Checking…</span>
    <span class="meta">
      <div id="checked">—</div>
      <button id="refresh" type="button">Refresh now</button>
    </span>
  </div>

  <div id="body"></div>

  <footer>
    Auto-refreshes every 20 s. The proxy check hits Caddy directly; everything
    else comes from <a href="/api/v1/health">/api/v1/health</a>, so this page
    stays up and reports the outage even when the API is down.
  </footer>
</div>

<script>
// Kept to widely-supported syntax (no ?. or ??): an older browser that can't
// parse the script would run none of it and sit forever on "Checking…".
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

// Fetch with a hard timeout, so a request that never answers surfaces as a
// failure instead of hanging the page.
function fetchT(url, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal, cache: "no-store" })
    .finally(() => clearTimeout(timer));
}

// Map a source status string to one of our four visual states.
function cls(status) {
  if (status === "ok") return "s-ok";
  if (status === "error") return "s-bad";
  if (status == null || status === "unknown") return "s-unknown";
  return "s-warn"; // degraded, unconfigured, absent, disabled, …
}
const PILL = { "s-ok": "operational", "s-bad": "down", "s-warn": "attention", "s-unknown": "unknown" };

function tile(name, status, rows) {
  const c = cls(status);
  const detail = (rows || []).filter(Boolean).map(([k, v]) =>
    `<div><span class="k">${esc(k)}:</span> <span class="mono">${esc(v)}</span></div>`).join("");
  return `<div class="tile ${c}">
    <div class="head"><span class="name">${esc(name)}</span>
      <span class="pill">${PILL[c]}</span></div>
    ${detail ? `<div class="detail">${detail}</div>` : ""}</div>`;
}

function group(title, tiles) {
  const shown = tiles.filter(Boolean);
  if (!shown.length) return "";
  return `<div class="section">${esc(title)}</div><div class="grid">${shown.join("")}</div>`;
}

function fmtDate(s) { return s ? String(s).slice(0, 10) : "—"; }
function fmtNum(n)  { return typeof n === "number" ? n.toLocaleString() : "—"; }
function datasetDate(s) {
  const m = s ? String(s).match(/\d{4}-\d{2}-\d{2}/) : null;
  return m ? m[0] : null;
}

async function load() {
  $("checked").textContent = "checking…";

  // Two independent probes, each with a hard timeout: Caddy answers
  // /caddy-health itself; the backend answers /api/v1/health. Either can fail —
  // or hang — without hiding the other or freezing the page.
  const [caddy, health] = await Promise.all([
    fetchT("/caddy-health", 6000).then(r => r.ok).catch(() => false),
    fetchT("/api/v1/health", 8000).then(r => r.json()).catch(() => null),
  ]);

  const proxy = tile("Caddy proxy", caddy ? "ok" : "error",
    [["role", "TLS + routing"], ["endpoint", "/caddy-health"]]);

  let backend, cached = [], external = [], usdaState = null;
  if (!health) {
    backend = tile("API backend", "error", [["detail", "unreachable"]]);
  } else {
    backend = tile("API backend", health.status === "degraded" ? "degraded" : health.status,
      [["overall", health.status]]);

    const u = health.usda_fdc_local, o = health.open_food_facts_local,
          g = health.gpc, rs = health.response_store;
    cached = [
      u && tile("USDA FDC — local copy", u.status,
        [["dataset", fmtDate(datasetDate(u.dataset))],
         ["barcodes", fmtNum(u.barcodes)], ["imported", fmtDate(u.imported_at)],
         u.size_mb && ["size", u.size_mb + " MB"]]),
      o && tile("Open Food Facts — local copy", o.status,
        [["dataset", (o.dataset || "").replace("off-", "")],
         ["products", fmtNum(o.products)], ["imported", fmtDate(o.imported_at)],
         o.size_mb && ["size", o.size_mb + " MB"]]),
      g && tile("GPC taxonomy", g.status, [
        ["version", g.version],
        ["scope", g.scope],
        g.counts && ["hierarchy",
          `${fmtNum(g.counts.segments)} seg → ${fmtNum(g.counts.families)} fam → `
          + `${fmtNum(g.counts.classes)} class → ${fmtNum(g.counts.bricks)} brick`],
        g.counts && ["attributes",
          `${fmtNum(g.counts.attribute_types)} types / ${fmtNum(g.counts.attribute_values)} values`],
        g.size_mb != null && ["size", g.size_mb + " MB"],
        ["published", g.xml_date],
      ]),
      rs && tile("Response store", rs.enabled ? "ok" : "disabled",
        [["records", fmtNum(Object.values(rs.records || {}).reduce((a, b) => a + b, 0))],
         ["ttl", (rs.ttl_days == null ? "—" : rs.ttl_days) + " days"]]),
    ];
    const live = health.usda_fdc || {};
    // A DEMO_KEY works but is throttled to a trickle, so flag it as needing
    // attention even when the probe itself is green.
    usdaState = (live.key === "demo" && live.status === "ok") ? "demo"
      : (live.key === "missing" && live.status !== "error") ? "unconfigured" : live.status;
    const keyLabel = { configured: "real key — full rate",
      demo: "DEMO_KEY — throttled", missing: "not set" }[live.key] || live.key;
    external = [
      health.usda_fdc && tile("USDA FDC — live API", usdaState, [
        ["token", keyLabel],
        live.total_foods != null && ["reachable", "yes"],
        live.detail && ["detail", live.detail.slice(0, 60)],
      ]),
      health.open_food_facts && tile("Open Food Facts — live API", health.open_food_facts.status,
        [health.open_food_facts.detail && ["detail", health.open_food_facts.detail.slice(0, 60)]]),
    ];
  }

  $("body").innerHTML =
    group("Edge", [proxy, backend]) +
    group("Cached data (served from disk)", cached) +
    group("External APIs (fallback for cache misses)", external);

  // Overall banner: the worst state among proxy, backend, and the live probes.
  const states = [caddy ? "s-ok" : "s-bad"];
  if (health) {
    states.push(health.status === "ok" ? "s-ok" : "s-warn");
    // usdaState carries the DEMO_KEY / missing-key downgrade, so the banner
    // agrees with the tile instead of staying green on a throttled key.
    if (usdaState) states.push(cls(usdaState));
    if (health.open_food_facts) states.push(cls(health.open_food_facts.status));
    ["usda_fdc_local", "open_food_facts_local", "gpc"].forEach(k => health[k] && states.push(cls(health[k].status)));
  } else {
    states.push("s-bad");
  }
  const worst = states.includes("s-bad") ? "s-bad"
    : states.includes("s-warn") ? "s-warn"
    : states.includes("s-unknown") ? "s-unknown" : "s-ok";
  const label = { "s-ok": "All systems operational",
    "s-warn": "Degraded — some components need attention",
    "s-bad": "Outage — a component is down",
    "s-unknown": "Status unknown" }[worst];
  $("banner").className = "banner " + worst;   // the .s-* class sets --bar
  $("overall").textContent = label;
  $("checked").textContent = "Checked " + new Date().toLocaleTimeString();
}

// Any unexpected error must show, not leave the banner stuck on "Checking…".
function safeLoad() {
  Promise.resolve().then(load).catch(err => {
    $("banner").className = "banner s-bad";
    $("overall").textContent = "Could not load status";
    $("checked").textContent = String(err && err.message ? err.message : err);
  });
}

// A last-resort net for a parse/runtime error anywhere on the page.
window.addEventListener("error", () => {
  if ($("overall").textContent === "Checking…") {
    $("overall").textContent = "Status page error — see the browser console";
    $("banner").className = "banner s-bad";
  }
});

$("refresh").addEventListener("click", safeLoad);
safeLoad();
setInterval(safeLoad, 20000);
</script>
</body>
</html>
