version: 2

# "Keep versions current" (this file) is a separate concern from "block on
# a known-bad version" (pip-audit, wired into ci.yml and
# .github/workflows/dependency-audit.yml) — a dependency can be perfectly
# current and still vulnerable the day a CVE is disclosed against it, and a
# dependency can be outdated with no known vulnerability at all. See
# PLAN.md item 7.
#
# Four ecosystems this project has a real dependency surface in: pip
# (requirements.txt/requirements-dev.txt), GitHub Actions (the workflow
# files under .github/workflows/), the Dockerfile's base image, and — since
# the /app mobile scanner (MOBILE_APP.md) started vendoring
# @zxing/library for its Safari/iOS barcode-decode fallback — npm.
# package.json declares that one dependency purely so audit tooling has a
# manifest to check; deploy/site/app/ itself is still served as plain
# static files, no npm build step runs at deploy time. jstests/ (our own
# JS) still uses only Node's built-in node:test/node:assert/node:fs/
# node:path/node:vm modules — this npm entry exists for the one vendored
# third-party file, not for our own code.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
